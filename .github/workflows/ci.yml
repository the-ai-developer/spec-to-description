name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every python file compiles
        run: python -m compileall -q spec2desc train eval data tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests -q
      - name: Coverage
        run: pytest tests -q --cov=spec2desc --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-py${{ matrix.python-version }}
          path: coverage.xml

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The committed notebook matches its builder
        run: |
          set -e
          python notebooks/build_notebooks.py
          if ! git diff --quiet -- notebooks/02_seq2seq_attention_from_scratch.ipynb; then
            echo "::error::notebook is out of date; run 'make notebooks' and commit the result"
            git --no-pager diff --stat -- notebooks/
            exit 1
          fi

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The generator is deterministic
        run: |
          set -e
          python data/make_synthetic_dataset.py --out /tmp/a --n 50 --seed 42 >/dev/null
          python data/make_synthetic_dataset.py --out /tmp/b --n 50 --seed 42 >/dev/null
          diff -r /tmp/a /tmp/b
          echo "same seed produced an identical corpus"

  train-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fine-tune for a handful of steps on a tiny corpus
        run: |
          set -e
          python data/make_synthetic_dataset.py --out data/generated --n 128 --seed 1
          python train/train_t5_description.py \
            --train data/generated/train.jsonl \
            --val   data/generated/val.jsonl \
            --out   checkpoints/smoke \
            --epochs 1 --batch-size 4 --no-fp16
          test -f checkpoints/smoke/train_meta.json
          test -f checkpoints/smoke/config.json
